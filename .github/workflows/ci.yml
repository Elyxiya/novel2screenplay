name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # FIX-07：PG leg 常驻化——DATABASE_URL 固定指向 service 容器（不再依赖 secrets，
    # 杜绝"未配置则静默跳过 PG 分支"）；repository-contract / schema-parity / job-lock
    # 等双后端套件每次 CI 均真实跑 PostgreSQL + SQLite 两条腿。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: novel2screenplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/novel2screenplay_test
      # 测试库命名空间：resolveTestPgUrl 优先使用它，避免自动追加 `_test` 后缀
      # 连到不存在的库（见 src/__tests__/helpers/dual-backend.ts）
      PG_TEST_DATABASE: novel2screenplay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify PG leg is active (fail fast, no silent skip)
        run: |
          node -e "const u=process.env.DATABASE_URL; if(!u){console.error('DATABASE_URL missing — PG leg would be silently skipped'); process.exit(1);} console.log('PG leg active:', u);"
      - run: npm test
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
        if: always()

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 清理构建缓存，确保每次都是干净构建
      - name: Clean build cache
        run: rm -rf .next tsconfig.tsbuildinfo
      # better-sqlite3 为原生模块，提前构建确保产物可用
      - run: npm rebuild better-sqlite3
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 7
        if: always()
