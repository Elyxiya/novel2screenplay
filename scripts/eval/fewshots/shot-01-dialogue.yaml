id: shot-01-dialogue
note: 对白密集段——引号原话只保留原句、明确说话人归属、台词不漏不补
source:
  text: |
    「你终于来了。」老者靠在门框上，声音沙哑。
    林砚没有答话，只是把伞收了起来。
    「东西呢？」
    「先回答我一个问题。」林砚抬起头，「三年前那把火，是谁放的？」
    老者笑了一声，不置可否。
